<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-amber" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Bayer Dither Matrix Grid Pattern -->
    <pattern id="bayer-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#38bdf8" fill-opacity="0.1" />
      <rect x="8" y="4" width="1" height="1" fill="#38bdf8" fill-opacity="0.06" />
      <rect x="4" y="8" width="1" height="1" fill="#38bdf8" fill-opacity="0.08" />
      <rect x="12" y="12" width="1" height="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.04em; fill: #ffffff; }
    .subtitle { font-weight: 400; fill: #94a3b8; font-size: 13.5px; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .metric-val { font-weight: 700; fill: #f8fafc; font-size: 28px; }
    .metric-lbl { font-weight: 500; fill: #64748b; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="400" rx="16" fill="url(#bg-grad)" />
  <rect width="880" height="400" rx="16" fill="url(#glow-cyan)" />
  <rect width="880" height="400" rx="16" fill="url(#glow-amber)" />
  <rect width="880" height="400" rx="16" fill="url(#bayer-grid)" />
  <rect width="880" height="400" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="880" height="3" rx="1.5" fill="url(#accent-bar)" />

  <!-- Header Branding -->
  <g transform="translate(48, 44)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="194" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="24" y="15.5" class="font-mono tag" fill="#38bdf8">OMARCHY SHELL • WAYLAND</text>

    <!-- Main Title -->
    <text x="0" y="68" class="font-mono title" font-size="40">oma-type</text>

    <!-- Tagline -->
    <text x="0" y="94" class="font-sans subtitle">
      Minimalist, ultra-fast typing practice engine running natively on <tspan fill="#e2e8f0" font-weight="600">wlr-layer-shell</tspan> with PipeWire mechanical switch audio.
    </text>
  </g>

  <!-- Interactive Terminal Card Mockup -->
  <g transform="translate(48, 160)" filter="url(#shadow-main)">
    <!-- Card Frame -->
    <rect width="784" height="196" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

    <!-- Window Header -->
    <rect width="784" height="36" rx="12" fill="#0b1120" fill-opacity="0.7" />
    <!-- Traffic lights -->
    <circle cx="22" cy="18" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="38" cy="18" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="54" cy="18" r="4.5" fill="#10b981" fill-opacity="0.75" />

    <!-- Mode Selector Pills -->
    <g transform="translate(180, 8)">
      <rect x="0" y="0" width="62" height="20" rx="10" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="31" y="13.5" class="font-mono tag" font-size="9" fill="#38bdf8" text-anchor="middle">time 30</text>

      <text x="88" y="13.5" class="font-mono tag" font-size="9" fill="#64748b" text-anchor="middle">words</text>
      <text x="140" y="13.5" class="font-mono tag" font-size="9" fill="#64748b" text-anchor="middle">quote</text>

      <text x="180" y="13.5" class="font-mono tag" font-size="9" fill="#334155" text-anchor="middle">|</text>

      <rect x="198" y="0" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="233" y="13.5" class="font-mono tag" font-size="9" fill="#94a3b8" text-anchor="middle">thock 🔊</text>

      <rect x="276" y="0" width="44" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="298" y="13.5" class="font-mono tag" font-size="9" fill="#94a3b8" text-anchor="middle">en 🇬🇧</text>
    </g>

    <!-- Typing Text Stream (Monkeytype Style) -->
    <g transform="translate(32, 74)">
      <!-- Typed completed characters (bright white/cyan) -->
      <text x="0" y="24" class="font-mono" font-size="21" font-weight="500" fill="#f8fafc" letter-spacing="0.04em">the great</text>
      
      <!-- Blinking smooth cursor bar -->
      <rect x="116" y="5" width="2.5" height="24" rx="1" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
      </rect>

      <!-- Remaining un-typed ghost characters -->
      <text x="122" y="24" class="font-mono" font-size="21" font-weight="400" fill="#475569" letter-spacing="0.04em">est glory in living lies not in never falling</text>
      <text x="0" y="56" class="font-mono" font-size="21" font-weight="400" fill="#334155" letter-spacing="0.04em">but in rising every time we fall.</text>
    </g>

    <!-- Live Hardware Telemetry HUD Row -->
    <g transform="translate(32, 142)">
      <!-- Divider line -->
      <line x1="0" y1="0" x2="720" y2="0" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

      <!-- Metric 1: WPM -->
      <g transform="translate(0, 12)">
        <text x="0" y="10" class="font-mono metric-lbl">SPEED</text>
        <text x="0" y="34" class="font-mono metric-val" fill="#38bdf8">128 <tspan font-size="13" font-weight="500" fill="#64748b">WPM</tspan></text>
      </g>

      <!-- Metric 2: Accuracy -->
      <g transform="translate(130, 12)">
        <text x="0" y="10" class="font-mono metric-lbl">ACCURACY</text>
        <text x="0" y="34" class="font-mono metric-val" fill="#10b981">99.4%</text>
      </g>

      <!-- Metric 3: Raw WPM -->
      <g transform="translate(250, 12)">
        <text x="0" y="10" class="font-mono metric-lbl">RAW</text>
        <text x="0" y="34" class="font-mono metric-val" fill="#94a3b8">134</text>
      </g>

      <!-- Metric 4: Latency -->
      <g transform="translate(340, 12)">
        <text x="0" y="10" class="font-mono metric-lbl">LATENCY</text>
        <text x="0" y="34" class="font-mono metric-val" fill="#f59e0b">&lt; 1 <tspan font-size="13" font-weight="500" fill="#64748b">ms</tspan></text>
      </g>

      <!-- Architecture Badges on Right -->
      <g transform="translate(480, 16)">
        <rect x="0" y="0" width="108" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="54" y="14" class="font-mono" font-size="10" fill="#94a3b8" text-anchor="middle">wlr-layer-shell</text>

        <rect x="116" y="0" width="124" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="178" y="14" class="font-mono" font-size="10" fill="#94a3b8" text-anchor="middle">pw-play (PipeWire)</text>
      </g>
    </g>
  </g>
</svg>